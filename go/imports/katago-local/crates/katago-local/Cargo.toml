[package]
name = "katago-local"
version = "0.1.0"
edition = "2021"
description = "Local KataGo engine, storage, SGF and compatibility APIs"
default-run = "katago-local"

[features]
test-fixtures = []

[lib]
test = false

[[bin]]
name = "katago-local"
path = "src/main.rs"
test = false

[[bin]]
name = "protocol-fixture"
path = "tests/support/protocol_fixture.rs"
required-features = ["test-fixtures"]
test = false

[dependencies]
anyhow = "1"
base64 = "0.22"
ctrlc = "3"
dunce = "1"
encoding_rs = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

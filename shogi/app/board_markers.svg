<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<rect width="210" height="297" fill="white"/>
<text x="15" y="17" font-size="5" font-family="sans-serif">SO-101 shogi board markers - print at 100%</text>
<text x="15" y="24" font-size="3.2" font-family="sans-serif">Black square: 26 mm. Keep the arrows pointing the same way.</text>
<rect x="15" y="45" width="40" height="40" fill="white" stroke="#bbb" stroke-dasharray="1 1" stroke-width=".25"/>
<image x="22" y="52" width="26" height="26" href="data:image/png;base64,"/>
<text x="15" y="42" font-size="4" font-family="sans-serif">ID 0 : 9a / top left</text>
<text x="32" y="37" font-size="4" font-family="sans-serif">UP</text>
<rect x="115" y="45" width="40" height="40" fill="white" stroke="#bbb" stroke-dasharray="1 1" stroke-width=".25"/>
<image x="122" y="52" width="26" height="26" href="data:image/png;base64,"/>
<text x="115" y="42" font-size="4" font-family="sans-serif">ID 1 : 1a / top right</text>
<text x="132" y="37" font-size="4" font-family="sans-serif">UP</text>
<rect x="15" y="145" width="40" height="40" fill="white" stroke="#bbb" stroke-dasharray="1 1" stroke-width=".25"/>
<image x="22" y="152" width="26" height="26" href="data:image/png;base64,"/>
<text x="15" y="142" font-size="4" font-family="sans-serif">ID 3 : 9i / bottom left</text>
<text x="32" y="137" font-size="4" font-family="sans-serif">UP</text>
<rect x="115" y="145" width="40" height="40" fill="white" stroke="#bbb" stroke-dasharray="1 1" stroke-width=".25"/>
<image x="122" y="152" width="26" height="26" href="data:image/png;base64,"/>
<text x="115" y="142" font-size="4" font-family="sans-serif">ID 2 : 1i / bottom right</text>
<text x="132" y="137" font-size="4" font-family="sans-serif">UP</text>
<text x="15" y="240" font-size="3.5" font-family="sans-serif">Place each numbered marker outside the matching grid corner.</text>
<text x="15" y="247" font-size="3.5" font-family="sans-serif">The black square corner facing the board must meet the grid corner.</text>
</svg>
<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>球面の薄膜シミュレーター</title><style>body{font:15px system-ui;background:#101622;color:#edf4fa;margin:0}main{max-width:1180px;margin:auto;padding:22px}h1{font-size:25px}p{color:#adbfce;line-height:1.55}.grid{display:grid;grid-template-columns:320px 1fr;gap:20px}section{background:#1a2534;padding:18px;border-radius:14px}label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:9px 0}input,select{width:105px;padding:6px;border-radius:6px;border:1px solid #728399;background:#101b27;color:white}button{background:#74d5d0;border:0;border-radius:8px;padding:11px;color:#082323;font-weight:bold;cursor:pointer;width:100%;margin-top:8px}button:disabled{opacity:.45}#stop{background:#e4b58e}img{width:100%;border-radius:8px;background:#111;min-height:80px}#status{white-space:pre-wrap;word-break:break-all;color:#d5e3eb}details{border-top:1px solid #536272;padding-top:10px;margin-top:14px}summary{cursor:pointer;font-weight:bold}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>球面の薄膜シミュレーター <small>試作</small></h1><p>球面上の渦と膜厚を時間発展させ、360°画像を保存します。作者の方式と完全な一致は未確認です。</p><div class="grid"><section><label>計算方式 <select id="solver"><option value="grid" selected>球面格子（新）</option><option value="particle">粒子・メッシュ（旧）</option></select></label><label>流体画像の幅 <select id="grid_width"><option>256</option><option>512</option><option selected>1024</option><option>2048</option></select></label><label class="particle">球面メッシュ <select id="subdivision"><option value="2">2（速い）</option><option value="3" selected>3（標準）</option><option value="4">4（細かい）</option></select></label><label class="particle">1面あたりの粒子<input id="particles" type="number" value="4" min="1" max="12"></label><label>小さい渦の割合<input id="fine_vortices" type="number" value="1" step="0.1" min="0" max="1"></label><label class="grid-only">初期の細かな膜厚差（nm）<input id="initial_detail_nm" type="number" value="120" min="0" max="300" step="10"></label><label>渦の強さ<input id="swirl" type="number" step="1" value="20"></label><label>重力<input id="gravity" type="number" step="0.005" value="0.008"></label><label>界面活性剤の力<input id="marangoni" type="number" step="0.005" value="0"></label><label>平均膜厚（nm）<input id="thickness" type="number" value="600"></label><label>膜厚の初期変化（nm）<input id="variation" type="number" value="300"></label><label>保存する画像幅 <select id="width"><option>512</option><option selected>1024</option><option>2048</option><option>4096</option><option>8192</option></select></label><label>開始前の計算回数<input id="preroll" type="number" value="30" min="0" max="2000"></label><label>フレーム数<input id="frames" type="number" value="24" min="1" max="1000"></label><label>フレーム間の計算回数<input id="steps" type="number" value="1" min="1" max="100"></label><label>フレームの時間倍率<input id="time_scale" type="number" value="0.22" min="0.05" max="3" step="0.01"></label><details><summary>詳細設定</summary><label>時間刻み<input id="dt" type="number" step="0.005" value="0.02"></label><label class="particle">減衰<input id="damping" type="number" step="0.05" value="0.7"></label><label>界面活性剤の初期変化<input id="surfactant" type="number" step="0.01" value="0.12"></label><label>露出<input id="exposure" type="number" step="0.05" value="0.35"></label><label>彩度<input id="saturation" type="number" step="0.1" value="1"></label><label>乱数シード<input id="seed" type="number" value="12"></label><label>速度画像の最大値<input id="velocity_range" type="number" step="0.5" value="8"></label></details><button id="run">計算して保存</button><button id="stop" disabled>計算を停止</button></section><section><h2>プレビュー</h2><img id="preview" alt="書き出したフレームのプレビュー"><p id="status">準備完了</p><p>流体画像の幅を上げると細い膜厚の筋を保持しやすくなります。8K は保存画像の大きさです。細部の量は流体画像と計算格子の解像度で決まります。</p><p>保存結果: Color、Thickness、Velocity、Direction、計算状態と設定。長い処理中の停止は、現在の計算ステップまたは画像の書き出しが終わってから反映されます。</p></section></div></main><script>const token=new URLSearchParams(location.search).get('token');const ids=['solver','subdivision','grid_width','particles','fine_vortices','initial_detail_nm','swirl','gravity','marangoni','thickness','variation','dt','damping','surfactant','exposure','saturation','seed','width','preroll','frames','steps','time_scale','velocity_range'];const status=document.getElementById('status'),run=document.getElementById('run'),stop=document.getElementById('stop');let timer;function updateMode(){document.querySelectorAll('.particle').forEach(e=>e.style.display=document.getElementById('solver').value==='particle'?'flex':'none');document.querySelectorAll('.grid-only').forEach(e=>e.style.display=document.getElementById('solver').value==='grid'?'flex':'none')}document.getElementById('solver').onchange=updateMode;updateMode();run.onclick=async()=>{run.disabled=true;try{let data=Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value]));let r=await fetch('/run',{method:'POST',headers:{'X-Token':token,'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error(await r.text());clearTimeout(timer);await poll()}catch(e){status.textContent=e.message;run.disabled=false}};stop.onclick=async()=>{stop.disabled=true;await fetch('/stop',{method:'POST',headers:{'X-Token':token}})};async function poll(){try{const r=await fetch('/status',{headers:{'X-Token':token}});const s=await r.json();status.textContent=s.message;if(s.preview)document.getElementById('preview').src='/preview?token='+encodeURIComponent(token)+'&frame='+s.frame;run.disabled=s.state==='running';stop.disabled=s.state!=='running';if(s.state==='running')timer=setTimeout(poll,1200)}catch(e){status.textContent='接続エラー: '+e.message;run.disabled=false;stop.disabled=true}}poll();</script></body></html>

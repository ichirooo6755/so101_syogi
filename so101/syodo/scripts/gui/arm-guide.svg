<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="title desc">
<title id="title">SO-101全体と、動かす場所</title><desc id="desc">土台から肩、ひじ、手首、筆の順に接続されます。筆を立てる主役は手首の曲げ。筆元の回転と、一番先端の傾きは別の動きです。位置を示す模式図で、実寸図ではありません。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#89957d"/></marker></defs>
<rect width="900" height="590" rx="16" fill="#fafbf7"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif" fill="#2e3728">
<text x="36" y="42" font-size="21" font-weight="600">まず、全体のどこにあるか</text>
<text x="36" y="71" font-size="14" fill="#7b866f">横から見た模式図。黄色い部分がアーム、茶色の棒が筆です。</text>

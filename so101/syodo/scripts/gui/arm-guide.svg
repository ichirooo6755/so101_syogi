<text x="674" y="458" font-size="15" fill="#7b866f">紙</text>
<path d="M139 367L79 331H40" fill="none" stroke="#a8b59a" stroke-width="2"/><text x="38" y="317" font-size="18">肩</text>
<path d="M226 168L190 120H88" fill="none" stroke="#a8b59a" stroke-width="2"/><text x="88" y="108" font-size="18">ひじ</text>
<path d="M478 214L463 124H367" fill="none" stroke="#b78142" stroke-width="2"/><text x="360" y="103" font-size="20" fill="#94652f">手首の曲げ</text><text x="360" y="128" font-size="14" fill="#94652f">筆を立てる主役</text>
<path d="M571 252L631 163H687" fill="none" stroke="#55799d" stroke-width="2"/><text x="687" y="152" font-size="19" fill="#496b8d">筆元の回転</text>
<path d="M620 292L695 267H738" fill="none" stroke="#718f5c" stroke-width="2"/><text x="738" y="256" font-size="19" fill="#5d7a48">先端の傾き</text><text x="710" y="288" font-size="14" fill="#5d7a48">立てる／寝かせる補助</text>
<path d="M619 321H729" fill="none" stroke="#819195" stroke-width="1.5"/><text x="737" y="326" font-size="15" fill="#6b7b80">ロードセルと筆受け</text>

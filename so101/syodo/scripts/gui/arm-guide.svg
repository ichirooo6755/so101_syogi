<path d="M240 196L491 236" stroke="#8c762c" stroke-width="38" stroke-linecap="round"/>
<path d="M240 196L491 236" stroke="#edc756" stroke-width="31" stroke-linecap="round"/>
<circle cx="175" cy="406" r="29" fill="#424d3a" stroke="#dae2cf" stroke-width="7"/>
<circle cx="240" cy="196" r="28" fill="#424d3a" stroke="#dae2cf" stroke-width="7"/>
<path d="M491 236L555 258" stroke="#e7bf48" stroke-width="29" stroke-linecap="round"/>
<circle cx="491" cy="236" r="27" fill="#fff8eb" stroke="#b78142" stroke-width="7"/>
<path d="M552 243L597 260L585 293L541 276Z" fill="#465b75" stroke="#2d435b" stroke-width="2"/>

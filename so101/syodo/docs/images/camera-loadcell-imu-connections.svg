<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Mac、カメラ、ロードセル、IMUの接続</title><desc id="desc">MacはUSBでXIAOに給電し、Wi-FiでXIAOから画像と荷重を受け取る。XIAOにHX711とIMUを接続し、HX711には筆元のロードセルを接続する。IMUとUSBデータ転送は今後の追加。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#557268"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#48728e"/></marker></defs>
<rect width="1200" height="650" rx="20" fill="#f7f8f5"/><g font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif" fill="#21372e">
<text x="48" y="47" font-size="28" font-weight="700">全体のつながり</text><text x="48" y="75" font-size="16" fill="#617467">配線の考え方を示す図です。部品の向きや大きさは実物と異なります。</text>
<g><rect x="55" y="186" width="245" height="157" rx="18" fill="#fff" stroke="#8ca59a" stroke-width="2"/><text x="177" y="235" text-anchor="middle" font-size="23" font-weight="700">Mac</text><text x="177" y="267" text-anchor="middle" font-size="16">書道GUI・データ保存</text><text x="177" y="297" text-anchor="middle" font-size="15" fill="#617467">アームは別のUSBで接続</text></g>
<g><rect x="448" y="165" width="300" height="192" rx="18" fill="#e9f3ee" stroke="#527c6a" stroke-width="2"/><text x="598" y="207" text-anchor="middle" font-size="23" font-weight="700">XIAO ESP32S3 Sense</text><text x="598" y="237" text-anchor="middle" font-size="16">腕の途中に取り付ける</text><rect x="494" y="260" width="208" height="58" rx="12" fill="#fff" stroke="#8ca59a"/><text x="598" y="285" text-anchor="middle" font-size="16">付属カメラ</text><text x="598" y="305" text-anchor="middle" font-size="14" fill="#617467">筆先を見る向き</text></g>
<g><rect x="892" y="125" width="250" height="126" rx="18" fill="#fff" stroke="#92a6ba" stroke-width="2"/><text x="1017" y="169" text-anchor="middle" font-size="22" font-weight="700">６軸 IMU</text><text x="1017" y="198" text-anchor="middle" font-size="15">姿勢・動きの記録用</text><text x="1017" y="224" text-anchor="middle" font-size="14" fill="#7c6651">部品選定・ソフトは未完了</text></g>
<g><rect x="475" y="458" width="246" height="116" rx="18" fill="#fff" stroke="#8ca59a" stroke-width="2"/><text x="598" y="500" text-anchor="middle" font-size="22" font-weight="700">HX711 基板</text><text x="598" y="531" text-anchor="middle" font-size="15">ロードセルの信号を読み取る</text></g>
<g><rect x="891" y="459" width="251" height="115" rx="18" fill="#fff" stroke="#b4a083" stroke-width="2"/><text x="1017" y="500" text-anchor="middle" font-size="21" font-weight="700">SC616C ロードセル</text><text x="1017" y="531" text-anchor="middle" font-size="15">筆元に取り付ける構成</text></g>
<line x1="300" y1="232" x2="436" y2="232" stroke="#557268" stroke-width="3"/><polygon points="436,226 447,232 436,238" fill="#557268"/><text x="365" y="216" text-anchor="middle" font-size="15">USB給電</text><line x1="448" y1="310" x2="312" y2="310" stroke="#48728e" stroke-width="3" stroke-dasharray="8 6"/><polygon points="312,304 301,310 312,316" fill="#48728e"/><text x="370" y="289" text-anchor="middle" font-size="14">Wi-Fi：画像・荷重</text>
<line x1="892" y1="198" x2="762" y2="198" stroke="#48728e" stroke-width="3"/><polygon points="762,192 751,198 762,204" fill="#48728e"/><text x="820" y="179" text-anchor="middle" font-size="15">I²C：追加予定</text>
<line x1="598" y1="458" x2="598" y2="370" stroke="#48728e" stroke-width="3"/><polygon points="592,370 598,359 604,370" fill="#48728e"/><text x="620" y="400" font-size="15">DAT / CLK</text><text x="620" y="423" font-size="14">D0 / D1</text>
<line x1="891" y1="516" x2="734" y2="516" stroke="#557268" stroke-width="3"/><polygon points="734,510 723,516 734,522" fill="#557268"/><text x="805" y="495" text-anchor="middle" font-size="15">４線</text>
<text x="52" y="604" font-size="15" fill="#617467">電源の枝分かれ・GND・端子ごとの配線は、本文の表を確認してください。</text><text x="52" y="627" font-size="14" fill="#617467">USBは現在「給電」。画像と荷重はWi-Fi。IMUをつないでも、現状のソフトではまだ記録しません。</text>
</g></svg>
